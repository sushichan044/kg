name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-only: true

      - name: Verify Go install
        run: go install .
        env:
          GOBIN: ${{ runner.temp }}/bin

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Go checks
        run: vp run lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Test
        run: vp run test:ci

      - name: Add job summary
        if: always()
        run: |
          go tool tparse -file ./go-test.out -format markdown >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Check
        run: vp run -r check

      - name: Check unused code
        run: vp run knip

      - name: Check generated frontend
        run: vp run check:generated

      - name: Unit tests
        run: vp run --filter @sushichan044/kg-core --filter @sushichan044/kg-viewer --filter kg-frontend test --project '*-unit'

  playwright-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Playwright version
        id: version
        run: echo "version=$(yq '.catalogs.dev.playwright' pnpm-workspace.yaml)" >> "$GITHUB_OUTPUT"

  browser-test:
    name: Run browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: playwright-version
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --init --ipc=host

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # The viewer is tested in WebKit too: vertical writing, ruby, and text-emphasis are where
      # engines differ most, and a Chromium-only run has already let a broken reading through.
      - name: Browser tests
        run: vp run --filter @sushichan044/kg-viewer --filter kg-frontend test --project '*-browser'

      - name: Upload test screenshots on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-screenshots
          path: |
            internal/frontend/src/**/__screenshots__/
            packages/viewer/src/**/__screenshots__/
          retention-days: 7
